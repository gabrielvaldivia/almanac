name: iOS regression tests
on:
  pull_request:
  push:
    branches: [main, codex/audit-fixes]
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.suite.name }} tests
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Unit
            target: Up NextTests
          - name: UI
            target: Up NextUITests
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          inventory = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          devices = [device for runtime, group in inventory['devices'].items() if runtime.endswith('iOS-26-5') for device in group if device['name'] == 'iPhone 17 Pro']
          if not devices:
              raise SystemExit('The iPhone 17 Pro / iOS 26.5 simulator is not installed on this runner')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ALMANAC_SIMULATOR=' + devices[0]['udid'] + '\n')
          PY
      - name: Build app, widgets, and tests
        run: |
          xcodebuild -project 'Up Next/Up Next.xcodeproj' -scheme 'Up Next' \
            -destination "platform=iOS Simulator,id=$ALMANAC_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/AlmanacDerivedData" \
            CODE_SIGN_IDENTITY=- build-for-testing
      - name: Run ${{ matrix.suite.name }} tests
        run: |
          xcodebuild -project 'Up Next/Up Next.xcodeproj' -scheme 'Up Next' \
            -destination "platform=iOS Simulator,id=$ALMANAC_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/AlmanacDerivedData" \
            -only-testing:'${{ matrix.suite.target }}' \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Almanac${{ matrix.suite.name }}Tests.xcresult" \
            CODE_SIGN_IDENTITY=- test-without-building
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-${{ matrix.suite.name }}-test-results
          path: ${{ runner.temp }}/Almanac*Tests.xcresult
